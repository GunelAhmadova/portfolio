<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Gunel Ahmadova — UX/UI Designer with a software development background. Research-driven product design for fintech, SaaS and mobile."
    />
    <title>Gunel Ahmadova — UX/UI Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=DM+Sans:opsz,wght@9..40,300..700&family=Spline+Sans+Mono:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set theme before first paint to avoid a flash of the wrong theme
      ;(function () {
        var forced = new URLSearchParams(location.search).get('theme')
        var stored = localStorage.getItem('theme')
        // Dark is the site's signature look — default to it unless the
        // visitor explicitly chose light before.
        var theme = forced || stored || 'dark'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
